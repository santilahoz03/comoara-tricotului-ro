<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=540">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:540px;height:960px;background:#17130E;font-family:'Arial',sans-serif;overflow:hidden;}
.wrap{width:540px;height:960px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:40px 36px;text-align:center;}

.eyebrow{font-size:13px;font-weight:700;color:#A63A2A;letter-spacing:.14em;
  text-transform:uppercase;margin-bottom:24px;}

.headline{font-size:38px;font-weight:700;color:#fff;line-height:1.15;
  font-family:'Georgia',serif;margin-bottom:28px;}

.divider{width:60px;height:3px;background:#A63A2A;margin:0 auto 28px;}

.body-text{font-size:17px;color:rgba(255,255,255,.75);line-height:1.6;margin-bottom:20px;}

.consequence{background:rgba(166,58,42,.15);border:1px solid #A63A2A;
  border-radius:10px;padding:18px 20px;margin-bottom:36px;}
.consequence p{font-size:15px;color:rgba(255,255,255,.85);line-height:1.55;}
.consequence strong{color:#fff;}

.cta-text{font-size:14px;color:rgba(255,255,255,.45);letter-spacing:.06em;
  text-transform:uppercase;margin-bottom:12px;}
.arrow{font-size:48px;color:#A63A2A;line-height:1;margin-bottom:16px;}
.cta-btn{font-size:16px;font-weight:700;color:#A63A2A;letter-spacing:.1em;
  text-transform:uppercase;border:2px solid #A63A2A;border-radius:8px;
  padding:14px 28px;display:inline-block;}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">⚠ Poslední šance</div>

  <div class="headline">Tato nabídka<br>se nezopakuje</div>
  <div class="divider"></div>

  <div class="body-text">Zavřením této stránky<br>odcházíš bez verze za 297 Kč —<br>navždy.</div>

  <div class="consequence">
    <p>Situační Arzenál™ za plnou cenu<br>
    znamená <strong>300 Kč navíc</strong><br>
    za přesně totéž.</p>
  </div>

  <div class="cta-text">Zmáčkni tlačítko níže</div>
  <div class="arrow">↓</div>
  <div class="cta-btn">ANO, CHCI ZA 297 KČ</div>
</div>
</body>
</html>
